<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Creación de Objetos</title>
<style>
  body {font-family: Arial, sans-serif;}
  .botones {
    margin-bottom: 10px;
  }
  #contenedor {
    width: 600px;
    height: 200px;
    background-color: #fffacd;
    overflow-y: auto;
    padding: 5px;
  }
  .claseObjetoDinamico {
    padding: 5px;
    margin-bottom: 5px;
    background-color: #d0f0d0;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>

<div class="botones">
  <button onclick="crearObjeto()">Crear</button>
  <button onclick="limpiar()">Limpiar</button>
  <button onclick="info()">Info</button>
</div>

<div id="contenedor"></div>

<script>
function crearObjeto() {
  var objDiv = document.createElement("div");

  var textoHtml = "<strong>Elemento creado Nº: "
    + (document.getElementById("contenedor").childNodes.length + 1)
    + "</strong>";

  objDiv.innerHTML = textoHtml;

  objDiv.className = "claseObjetoDinamico";

  document.getElementById("contenedor").appendChild(objDiv);
}

function limpiar() {
  var contenedor = document.getElementById("contenedor");
  while (contenedor.firstChild) {
    contenedor.removeChild(contenedor.firstChild);
  }
}

function info() {
  var hijos = document.getElementById("contenedor").childNodes;

  alert("longitud del childNode: " + hijos.length);

  for (var i = 0; i < hijos.length; i++) {
    alert("indice: " + i);
  }
}
</script>

</body>
</html>
