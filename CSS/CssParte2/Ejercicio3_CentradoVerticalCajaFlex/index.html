<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería Responsive Horizontal-Vertical</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: beige;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .galeria {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 30px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      justify-content: center;
      box-sizing: border-box;
    }

    .galeria img {
      width: 500px;
      height: auto;
      flex-shrink: 1;
      transition: all 0.3s ease;
    }

    @media (max-width: 1200px) {
      .galeria img {
        width: 450px;
      }
    }

    @media (max-width: 900px) {
      .galeria img {
        width: 400px;
      }
    }

    @media (max-width: 700px) {
      .galeria img {
        width: 350px;
      }
    }

    @media (max-width: 500px) {
      .galeria {
        flex-direction: column;
        align-items: center;
      }
      .galeria img {
        width: 90%;
        max-width: 450px;
      }
    }
  </style>
</head>
<body>
  <div class="galeria">
    <img src="https://picsum.photos/id/1015/600/400" alt="Imagen 1">
    <img src="https://picsum.photos/id/1016/600/400" alt="Imagen 2">
    <img src="https://picsum.photos/id/1018/600/400" alt="Imagen 3">
  </div>
</body>
</html>
