        body {

        nav {
            background-color: #2b4a82;
            display: flex;
        }
        nav a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            display: block;
            font-weight: bold;
        }
        nav a:hover {
            background-color: #1a2f52;
        }
        .dropdown {
            position: relative;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #2b4a82;
            min-width: 220px;
            z-index: 1000;
        }
        .dropdown-content a {
            padding: 12px 16px;
            font-weight: normal;
        }

        .dropdown-content a:hover {
            background-color: #1a2f52;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
