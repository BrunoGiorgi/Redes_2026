<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos por Sala - Tabla</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
    body { background-color: #f2f4f8; color: #333; }
    header, footer { position: fixed; left: 0; width: 100%; background-color: #0056b3; color: white; z-index: 10; }
    header { top: 0; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    footer { bottom: 0; height: 50px; text-align: center; line-height: 50px; font-weight: 600; box-shadow: 0 -2px 6px rgba(0,0,0,0.3); }

    .table-container { position: absolute; top: 70px; bottom: 50px; left: 0; right: 0; overflow-y: auto; padding: 20px; }
    h2 { font-size: 1.5em; color: #fff; margin: 0; }
    h3 { font-size: 1.2em; color: #0056b3; margin: 10px 0; }
    .botones { display: flex; gap: 10px; }
    button { background-color: white; border: 2px solid #0056b3; color: #0056b3; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.15s ease-in-out; }
    button:hover { background-color: #0056b3; color: white; }

    .sala { margin-bottom: 30px; }

    table { width: 100%; border-collapse: collapse; background-color: white; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
    th { background-color: #0077cc; color: white; }
    tr:nth-child(even) { background-color: #f0f6ff; }
    tfoot td { background-color: orange; color: #000; font-weight: bold; text-align: left; }

    .total-general { background-color: #0056b3; color: white; font-weight: bold; padding: 14px; border-radius: 10px; font-size: 1.1em; }

    .accion-btn { padding: 6px 8px; font-size: 0.9rem; border-radius: 6px; border: 1px solid #0077cc; background: white; color: #0077cc; cursor: pointer; }
    .accion-btn:hover { background:#0077cc; color:#fff; }

    @media (max-width: 900px) {
      th, td { font-size: 0.9rem; padding: 8px; }
      header { height: 90px; flex-direction: column; gap: 6px; padding: 10px 12px; align-items: flex-start; }
      .table-container { top: 90px; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:14px">
      <h2>Eventos por sala</h2>
    </div>
    <div class="botones">
      <button id="btnCargar">Cargar datos</button>
      <button id="btnVaciar">Vaciar datos</button>
    </div>
  </header>

  <div class="table-container">
    <div id="contenedor"></div>
  </div>

  <footer>
    Pie de pagina
  </footer>

  <script>
    var textoJSONSalas = '{"salas":[' +
      '{"sala":{"codigo":"S01","descripcion":"Salón Principal"},"eventos":[' +
        '{"codigo_evento":"EV001","descripcion":"Fiesta de cumpleaños 15","fecha_evento":"2026-11-07","recaudacion":850000,"flyer":"flyers/EV001.jpg"},' +
        '{"codigo_evento":"EV004","descripcion":"Casamiento","fecha_evento":"2026-12-05","recaudacion":1750000,"flyer":"flyers/EV004.jpg"}' +
      ']},' +
      '{"sala":{"codigo":"S02","descripcion":"Sala de Conferencias"},"eventos":[' +
        '{"codigo_evento":"EV002","descripcion":"Charla de tecnología y redes","fecha_evento":"2026-11-12","recaudacion":320000,"flyer":"flyers/EV002.png"}' +
      ']}' +
    ']}';

    var objSalas = JSON.parse(textoJSONSalas);

    const btnCargar = document.getElementById('btnCargar');
    const btnVaciar = document.getElementById('btnVaciar');
    const contenedor = document.getElementById('contenedor');

    function formatearMoneda(v){
      return v.toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
    }

    function renderSalas(){
      contenedor.innerHTML = '';
      let totalGeneral = 0;

      objSalas.salas.forEach((s, idxSala) => {
        let subtotal = 0;
        let filas = '';

        s.eventos.forEach((ev, idxEvento) => {
          const recaudacion = Number(ev.recaudacion) || 0;
          subtotal += recaudacion;

          filas += `
            <tr>
              <td>${escapeHtml(ev.codigo_evento)}</td>
              <td>${escapeHtml(ev.descripcion)}</td>
              <td>${escapeHtml(ev.fecha_evento)}</td>
              <td>$${formatearMoneda(recaudacion)}</td>
              <td>${ev.flyer ? escapeHtml(ev.flyer) : '-'}</td>
              <td><button class="accion-btn" data-sala="${idxSala}" data-evento="${idxEvento}">Ver Flyer</button></td>
            </tr>
          `;
        });

        totalGeneral += subtotal;

        const seccion = document.createElement('div');
        seccion.className = 'sala';
        seccion.innerHTML = `
          <h3>${escapeHtml(s.sala.codigo)} - ${escapeHtml(s.sala.descripcion)}</h3>
          <table>
            <thead>
              <tr>
                <th>Cód. Evento</th>
                <th>Descripción</th>
                <th>Fecha</th>
                <th>Recaudación (ARS)</th>
                <th>Flyer</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>${filas}</tbody>
            <tfoot>
              <tr>
                <td colspan="3">Total recaudado ${escapeHtml(s.sala.descripcion)}</td>
                <td>$${formatearMoneda(subtotal)}</td>
                <td colspan="2"></td>
              </tr>
            </tfoot>
          </table>
        `;
        contenedor.appendChild(seccion);
      });

      const total = document.createElement('div');
      total.className = 'total-general';
      total.textContent = 'Total general recaudado (ARS): $' + formatearMoneda(totalGeneral);
      contenedor.appendChild(total);

      contenedor.querySelectorAll('.accion-btn').forEach(b => b.addEventListener('click', onVerFlyer));
    }

    function onVerFlyer(e){
      const s = objSalas.salas[Number(e.currentTarget.dataset.sala)];
      if(!s) return;
      const ev = s.eventos[Number(e.currentTarget.dataset.evento)];
      if(!ev) return;
      if(ev.flyer && ev.flyer.trim() !== ''){
        // Abre la imagen del flyer en otra pestaña
        window.open(ev.flyer, '_blank');
      } else {
        alert('No hay flyer para este evento.');
      }
    }

    function vaciarTabla(){
      contenedor.innerHTML = '';
    }

    btnCargar.addEventListener('click', renderSalas);
    btnVaciar.addEventListener('click', vaciarTabla);

    function escapeHtml(s){
      if(s === null || s === undefined) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

  </script>
</body>
</html>
